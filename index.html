<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SEM 10-XP</title>
    <meta name="description" content="Semester 10 study tracker, planner, Pomodoro timer and exam countdowns — Windows XP themed." />
    <meta name="theme-color" content="#0a46c6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SEM 10-XP" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />

    <style>
      /* Prevents a flash of unstyled white page before React mounts */
      html, body, #root { height: 100%; margin: 0; background: #3f7ee8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Production build marker: 2026-10-03 -->
    <script>
      // One-time recovery: clear any older SEM10-XP PWA controller/cache before React loads.
      // The old guard ran cleanup asynchronously while main.jsx was already starting.
      (() => {
        const RECOVERY_KEY = "sem10xp:boot-recovery-20261003";
        const loadApp = () => {
          const s = document.createElement("script");
          s.type = "module";
          s.src = "./src/main.jsx";
          document.body.appendChild(s);
        };
        let recovered = false;
        try { recovered = sessionStorage.getItem(RECOVERY_KEY) === "1"; } catch (_) {}
        if (recovered) {
          loadApp();
          return;
        }
        try { sessionStorage.setItem(RECOVERY_KEY, "1"); } catch (_) {}
        if (!("serviceWorker" in navigator)) {
          loadApp();
          return;
        }
        navigator.serviceWorker.getRegistrations()
          .then((regs) => Promise.all(regs.map((reg) => reg.unregister())))
          .then(() => "caches" in window ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))) : null)
          .then(() => location.reload())
          .catch(() => loadApp());
      })();
    </script>
  </body>
</html>
